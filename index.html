<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:400,700|Montserrat:900">
    <title>D-Day Widget</title>
    <style>
        body {
            /* 전체 배경색 (노션에 맞게 투명하게 유지하려면 transparent) */
            background-color: transparent; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .widget-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 배경 크기 (앞 숫자 20px은 위아래 여백, 뒤 숫자 30px은 좌우 여백) */
            padding: 20px 30px; 
            border-radius: 12px;
            /* 박스 배경색 */
            background: #FCF9EC; 
        }

        .numbers {
            /* 숫자 폰트 종류 */
            font-family: 'Montserrat', sans-serif;
            /* 숫자 폰트 색상 */
            color: #4A3320;
            /* 숫자 크기 */
            font-size: 2.5em; 
            font-weight: 900;
            margin-bottom: 5px;
        }

        .label {
            /* 하단 문구 폰트 종류 ('맑은 고딕', '돋움', '굴림' 등으로 변경 가능) */
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
            /* 하단 문구 폰트 색상 */
            color: #C08A3F; 
            /* 하단 문구 크기 */
            font-size: 0.5em; 
            font-weight: 700;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="timer">
    <div class="widget-container"> 
        <div id="d-day-number" class="numbers">D-0</div>
        <!-- 하단 문구 수정하는 곳 -->
        <div class="label">전산세무 1급</div>
    </div> 
</div>

<script>
    // 목표 날짜 설정하는 곳
    const targetDate = new Date('Oct 3, 2026 00:00:00').getTime();

    let timer = setInterval(function() {
        const today = new Date().getTime();
        const diff = targetDate - today;
        
        let days = Math.ceil(diff / (1000 * 60 * 60 * 24));

        let dDayText = "";
        
        if (days > 0) {
            dDayText = "D-" + days;
        } else if (days === 0) {
            dDayText = "D-DAY";
        } else {
            dDayText = "D+" + Math.abs(days);
        }

        document.getElementById("d-day-number").innerText = dDayText;
    }, 1000); 
</script>
</body>
</html>
