<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:400,700|Montserrat:900">
    <title>D-Day Widget</title>
    <style>
        body {
            /* 전체 배경색 */
            background-color: transparent; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .widget-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 위젯이 화면 폭에 맞춰 유연하게 변하도록 가로 폭을 80%로 설정 */
            width: 80%;
            max-width: 400px; /* 너무 무한정 커지지 않도록 최대폭 제한 */
            padding: 5% 5%; 
            border-radius: 12px;
            /* 박스 배경색 */
            background: #FCF9EC; 
        }

        .numbers {
            font-family: 'Montserrat', sans-serif;
            color: #4A3320;
            
            /* 👇 핵심 변경 부분: 배경 폭에 따라 폰트 크기 자동 조절 */
            /* clamp(최소크기, 화면비례크기, 최대크기) */
            font-size: clamp(2.5em, 12vw, 5em); 
            
            font-weight: 900;
            margin-bottom: 5px;
            letter-spacing: 5px; 
        }

        .label {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
            color: #C08A3F; 
            
            /* 하단 문구도 폭에 맞춰 살짝씩 변하게 하려면 아래처럼 적용 */
            font-size: clamp(0.8em, 4vw, 1.2em); 
            
            font-weight: 700;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="timer">
    <div class="widget-container"> 
        <div id="d-day-number" class="numbers">D-0</div>
        <!-- 하단 문구 수정하는 곳 -->
        <div class="label">전산세무 1급</div>
    </div> 
</div>

<script>
    const targetDate = new Date('Oct 3, 2026 00:00:00').getTime();

    let timer = setInterval(function() {
        const today = new Date().getTime();
        const diff = targetDate - today;
        
        let days = Math.ceil(diff / (1000 * 60 * 60 * 24));

        let dDayText = "";
        
        if (days > 0) {
            dDayText = "D-" + days;
        } else if (days === 0) {
            dDayText = "D-DAY";
        } else {
            dDayText = "D+" + Math.abs(days);
        }

        document.getElementById("d-day-number").innerText = dDayText;
    }, 1000); 
</script>
</body>
</html>
